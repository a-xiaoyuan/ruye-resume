name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      # 单元测试不需要字体和 WASM；集成测试在字体存在时自动运行
      - run: pnpm test
      # 子集化需要 fonttools；没有它会退回 27MB 的完整字体，部署出去的网页首次打开会慢很多
      - run: pip install fonttools
      - run: pnpm fonts
      - run: pnpm test
      - run: pnpm build
      # 端到端测试：真实浏览器里走编辑、换模板、导出 PDF、Markdown 往返等主流程
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test
