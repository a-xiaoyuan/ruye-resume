name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      # 单元测试不需要字体和 WASM；集成测试在字体存在时自动运行
      - run: pnpm test
      - run: pnpm fonts
      - run: pnpm test
      - run: pnpm build
